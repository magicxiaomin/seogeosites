name: CI

on:
  push:
    branches: [main, seo-geo-factory-mvp]
  pull_request:
    branches: [main]

jobs:
  factory-validation:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Generate sample factory run
        run: npm run factory:sample

      - name: Build static staging site
        run: npm run build

      - name: Validate sample factory run
        run: npm run validate

      - name: Generate pilot review checklists
        run: npm run factory:review-checklists

      - name: Auto-approve pilot staging preview
        run: npm run factory:approve-staging

      - name: Inject accepted evidence into pilot pages
        run: npm run factory:inject-evidence

      - name: Generate strategy, cluster, and measurement artifacts
        run: npm run factory:strategy-artifacts

      - name: Generate editorial review pack
        run: npm run factory:review-pack

      - name: Validate content quality
        run: npm run validate:content-quality

      - name: Validate strategy artifacts
        run: npm run validate:strategy-artifacts

      - name: Build QA dashboard
        run: npm run factory:dashboard

      - name: Rebuild static staging site with hub page
        run: npm run build

      - name: Validate pilot batch
        run: npm run validate:pilot

      - name: Validate publish gates
        run: npm run validate:publish-gates

      - name: Sanity-check generated HTML and review artifacts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('public/ai-workflow-template-for-meeting-notes-and-action-items.html').read_text(encoding='utf-8')
          required = ['schema.org', 'Direct answer', 'Staging draft', 'Accepted sources', 'Google Meet official product page']
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit(f'Missing expected HTML markers: {missing}')
          dashboard = Path('public/qa-dashboard.html').read_text(encoding='utf-8')
          dashboard_required = ['Human review checklists', 'Editorial review pack', 'Content quality', 'Remaining actions', 'Privacy', 'Copyright/IP', 'Monetization', 'Staging approved']
          missing_dashboard = [item for item in dashboard_required if item not in dashboard]
          if missing_dashboard:
              raise SystemExit(f'Missing dashboard markers: {missing_dashboard}')
          checklist = Path('public/review-checklists.md').read_text(encoding='utf-8')
          if 'Human Review Checklists' not in checklist or 'Privacy/data-handling review' not in checklist:
              raise SystemExit('Review checklist artifact is incomplete')
          review_pack = Path('public/editorial-review-pack.md').read_text(encoding='utf-8')
          if 'Editorial review pack' not in review_pack or 'approve_for_production_batch' not in review_pack:
              raise SystemExit('Editorial review pack artifact is incomplete')
          hub = Path('public/ai-workflow-templates-for-business-teams.html').read_text(encoding='utf-8')
          if 'AI Workflow Templates for Business Teams' not in hub or 'noindex' not in hub:
              raise SystemExit('Hub staging page is incomplete')
          print('HTML and review artifact sanity checks passed')
          PY
